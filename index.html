<html lang="en-IN">
<head>
<meta charset="utf-8">

<title>Budgets &amp; pay</title>
<style>
:root {
  --bg: #f2f4f7; --card: #ffffff; --ink: #101720; --ink-2: #4a5462; --muted: #7a8494;
  --rule: #e3e6eb; --rule-2: #c9cfd8; --accent: #2a78d6; --accent-soft: #d6e5f8; --accent-ink: #fff;
  --chip: #e6eaf0; --hover: #f6f8fb; --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --warn-soft: #fbe9c4; --crit-soft: #f6d6d6; --ribbon: #fbe3e3; --ribbon-ink: #a52a2a;
  --shadow: 0 10px 40px rgba(16, 23, 32, .18);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0f12; --card: #171a1f; --ink: #eef1f5; --ink-2: #b6bdc8; --muted: #868e9b;
    --rule: #252a31; --rule-2: #353b45; --accent: #3987e5; --accent-soft: #1b2b42;
    --chip: #222830; --hover: #1c2026; --warn-soft: #3a2e10; --crit-soft: #3d1c1c; --ribbon: #3a1a1a; --ribbon-ink: #f2a3a3;
    --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, .r { font-variant-numeric: tabular-nums; }
kbd { font: 600 10.5px ui-monospace, "SF Mono", Menlo, monospace; border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); margin-left: auto; }

/* Shell: a sidebar of actions and places, and the page. */
.shell { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 18px 14px; border-right: 1px solid var(--rule); background: var(--card); }
.brand { font-weight: 750; font-size: 16px; letter-spacing: -.01em; padding: 2px 8px 10px; }
.brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.side .primary { margin-bottom: 2px; }
.side .ghost { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; }
.side nav { display: flex; flex-direction: column; gap: 1px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
.side nav a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 560; }
.side nav a:hover { background: var(--hover); }
.side nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.side nav .n { margin-left: auto; font-size: 12px; font-weight: 650; background: var(--warn-soft); color: var(--ink); border-radius: 999px; padding: 0 7px; }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--ink-2); padding: 0 8px; }
.side .foot a, .side .foot button { color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 560; }
#saved { display: flex; align-items: center; gap: 6px; }
#saved .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
#saved.busy .dot { background: var(--muted); }
#saved.bad .dot { background: var(--crit); }

main { padding: 26px 36px 80px; max-width: 1180px; width: 100%; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.pagehead h1 { margin: 0; font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
.pagehead p { margin: 3px 0 0; color: var(--ink-2); }
h2.sec { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; display: flex; justify-content: space-between; align-items: baseline; }
h2.sec span { text-transform: none; letter-spacing: 0; font-weight: 560; }

/* Buttons and inputs. */
.primary, .ghost, .mini, .danger { border-radius: 9px; cursor: pointer; font-weight: 650; border: 1px solid transparent; }
.primary { background: var(--accent); color: var(--accent-ink); padding: 9px 14px; display: flex; align-items: center; gap: 8px; }
.primary kbd { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.45); }
.primary:disabled { opacity: .55; cursor: not-allowed; }
.ghost { background: transparent; color: var(--ink); padding: 8px 12px; border-color: var(--rule-2); }
.ghost:hover, .mini:hover { background: var(--hover); }
.side .ghost { border-color: transparent; color: var(--ink-2); font-weight: 560; }
.mini { background: var(--card); border-color: var(--rule-2); padding: 3px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.danger { background: transparent; color: var(--crit); padding: 8px 12px; border-color: var(--crit-soft); }
.danger.armed { background: var(--crit); color: #fff; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; }
input[type=text], input[type=date], input[type=month], input[type=search], input:not([type]), select, textarea {
  border: 1px solid var(--rule-2); background: var(--card); border-radius: 8px; padding: 7px 10px; min-height: 36px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input.bad { border-color: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }
input.amt { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 0; background: var(--chip); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 560; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); }

/* Cards, tiles, meters, flags. */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 16px 18px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; cursor: pointer; text-align: left; }
.tile:hover { border-color: var(--rule-2); }
.tile .k { font-size: 12.5px; color: var(--ink-2); font-weight: 560; }
.tile .v { font-size: 24px; font-weight: 750; letter-spacing: -.02em; margin-top: 2px; }
.tile .s { font-size: 12.5px; color: var(--ink-2); }
.tile.hero .v { font-size: 30px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.hcard { display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.hcard:hover { border-color: var(--rule-2); }
.hcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.hcard .name { font-weight: 680; font-size: 15px; }
.hcard .code { color: var(--muted); font-size: 12.5px; margin-left: 6px; font-weight: 500; }
.hcard .big { font-size: 24px; font-weight: 750; letter-spacing: -.02em; }
.hcard .lbl, .meta { font-size: 12.5px; color: var(--ink-2); }
.meter { height: 6px; border-radius: 3px; overflow: hidden; background: var(--accent-soft); margin: 4px 0 2px; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.meter.warn { background: var(--warn-soft); } .meter.warn i { background: var(--warn); }
.meter.crit { background: var(--crit-soft); } .meter.crit i { background: var(--crit); }
.flag { font-size: 12.5px; display: flex; gap: 6px; align-items: flex-start; margin-top: 3px; }
.flag .ic { margin-top: 2.5px; }
.ic { width: 13px; height: 13px; flex: none; display: inline-block; vertical-align: -2px; }

/* Tables. */
table.t { width: 100%; border-collapse: collapse; }
.t th { text-align: left; font-size: 11.5px; font-weight: 650; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
.t td { padding: 9px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t .r { text-align: right; white-space: nowrap; }
.t .ck { width: 30px; padding-right: 0; }
.t .ck input { width: 16px; height: 16px; accent-color: var(--accent); margin: 2px 0 0; }
.t tbody tr[data-edit] { cursor: pointer; }
.t tbody tr[data-edit]:hover td { background: var(--hover); }
.t tr.mon td { background: var(--bg); font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 10px; cursor: default; }
.t .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 1px; }
.t .nowrap { white-space: nowrap; }
.t .act { width: 1%; }
.t tr .hov { visibility: hidden; }
.t tr:hover .hov, .t tr:focus-within .hov { visibility: visible; }
.t tfoot td { font-weight: 700; border-top: 1px solid var(--rule-2); border-bottom: 0; }
.empty { color: var(--ink-2); padding: 10px 0 2px; }
.fix { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
.fix input { width: 120px; min-height: 28px; padding: 3px 8px; }

.act-card { padding: 0; overflow: hidden; }
.act-card > header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 18px 8px; }
.act-card h3 { margin: 0; font-size: 15px; }
.act-card h3 .count { color: var(--ink-2); font-weight: 560; font-size: 13px; margin-left: 8px; }
.act-card header p { margin: 2px 0 0; color: var(--ink-2); font-size: 12.5px; }
.act-card .t { margin: 0 8px; width: calc(100% - 16px); }
.act-card .done { padding: 4px 18px 16px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.bulk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 18px; background: var(--accent-soft); border-top: 1px solid var(--rule); }
.bulk input[type=date] { width: 160px; min-height: 32px; padding: 4px 8px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input[type=search] { width: 280px; }
.toolbar select { width: auto; }

.start { max-width: 640px; margin: 8vh auto; }
.start h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.02em; }
.start p { color: var(--ink-2); margin: 0 0 14px; }
.start label.row { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--rule); }
.start label.row input { width: 16px; height: 16px; accent-color: var(--accent); }
.start .kind { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.start .btns { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.steps .st { display: flex; gap: 10px; align-items: flex-start; }
.steps .st .ic { margin-top: 3px; }
.steps .st.ok { color: var(--ink-2); }
.steps .st .chips { margin-top: 6px; }
.ribbon { background: var(--ribbon); color: var(--ribbon-ink); padding: 8px 16px; font-weight: 650; display: flex; gap: 12px; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 4; }
.ribbon button { background: var(--card); color: var(--ink); border: 0; border-radius: 999px; padding: 4px 12px; font-weight: 650; cursor: pointer; }

/* Status bar and toast. */
#bar { position: sticky; top: 0; z-index: 6; padding: 10px 18px; font-weight: 600; text-align: center; }
#bar.crit { background: var(--crit); color: #fff; }
#bar.warn { background: var(--warn-soft); color: var(--ink); }
#bar.info { background: var(--chip); color: var(--ink-2); font-weight: 560; }
#bar button { margin-left: 8px; background: var(--card); color: var(--ink); border: 0; border-radius: 999px; padding: 4px 12px; font-weight: 650; cursor: pointer; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--card); border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); z-index: 30; max-width: min(640px, 90vw); }
#toast.crit { background: var(--crit); color: #fff; }
#toast button { background: none; border: 0; color: inherit; font-weight: 750; text-decoration: underline; cursor: pointer; padding: 0; }

/* The drawer, where every form opens. */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .28); z-index: 10; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: var(--card); box-shadow: var(--shadow); z-index: 11; overflow-y: auto; }
.drawer form { padding: 20px 22px 26px; display: flex; flex-direction: column; gap: 14px; }
.drawer h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; display: flex; justify-content: space-between; align-items: center; }
.drawer h2 .x { background: none; border: 0; font-size: 22px; color: var(--muted); cursor: pointer; padding: 0 4px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field > .lab { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); }
.field .err { font-size: 12.5px; color: var(--crit); font-weight: 600; }
.field > .link { align-self: flex-start; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline input[type=date] { flex: 1; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg label { position: relative; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills label { position: relative; border: 1px solid var(--rule-2); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 13px; }
.pills label small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.pills input { position: absolute; opacity: 0; pointer-events: none; }
.pills label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pills label:has(input:checked) small { color: rgba(255,255,255,.8); }
.pills label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.box { border: 1px solid var(--rule); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.progress { display: grid; grid-template-columns: 150px 1fr; gap: 8px 10px; align-items: center; }
.progress input[type=date]:disabled { opacity: .45; }
.impact { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.impact b { font-variant-numeric: tabular-nums; }
.lines { display: flex; flex-direction: column; gap: 6px; }
.line3 { display: grid; grid-template-columns: 1fr 120px 28px; gap: 6px; align-items: center; }
.line4 { display: grid; grid-template-columns: 1fr 110px 120px 28px; gap: 6px; align-items: center; }
.line3 .rm, .line4 .rm { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.totals div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.totals span { display: block; font-size: 12px; color: var(--ink-2); }
.totals b { font-size: 16px; font-variant-numeric: tabular-nums; }
.btnrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; bottom: -26px; background: var(--card); padding: 12px 0 4px; border-top: 1px solid var(--rule); margin-top: 4px; }
.btnrow .grow { flex: 1; }
.formerr { background: var(--crit-soft); border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 13px; }
.note { font-size: 12.5px; color: var(--ink-2); }
body.readonly .writes { opacity: .5; }
.held { border-color: var(--warn); margin-bottom: 16px; }
.held-row { padding: 10px 0; border-top: 1px solid var(--rule); }
.held-row .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
details.working { margin: 4px 0 10px; font-size: 13px; }
details.working summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.working .l { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-variant-numeric: tabular-nums; }
.working .l > span:first-child { min-width: 0; }
.working .minus { color: var(--ink-2); }
.working .total { border-top: 1px solid var(--rule-2); margin-top: 4px; padding-top: 5px; font-weight: 700; }
.refresh { background: none; border: 0; padding: 0 2px; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.refresh[aria-busy] { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ph { display: none; }
@media (hover: none) { .t tr .hov { visibility: visible; } kbd { display: none; } }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } .side { position: static; height: auto; } .tiles { grid-template-columns: 1fr 1fr; } main { padding: 18px 16px 60px; } }

/* Small screens (the phone): one column, the pages as tabs along the bottom,
   + Expense floating above them, and each table row stacked as a block. */
@media (max-width: 700px) {
  body { font-size: 15px; padding-top: env(safe-area-inset-top, 0px); }
  input[type=text], input[type=date], input[type=month], input[type=search], input:not([type]), select, textarea { font-size: 16px; min-height: 42px; }
  .shell { display: block; min-height: 0; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 12px; padding: 12px 16px 2px; border: 0; background: none; }
  .brand { padding: 0; font-size: 15px; flex: 1; }
  .brand small { display: none; }
  .side > .ghost[data-new] { display: none; }
  .side > .primary[data-new] { position: fixed; right: 16px; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 8; border-radius: 999px; padding: 13px 20px; box-shadow: var(--shadow); font-size: 15px; }
  .side nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; flex-direction: row; gap: 0; margin: 0; padding: 0 0 env(safe-area-inset-bottom, 0px); border-top: 1px solid var(--rule); background: var(--card); }
  .side nav a { flex: 1; justify-content: center; padding: 16px 2px; border-radius: 0; font-size: 12.5px; position: relative; }
  .side nav a[aria-current="page"] { background: none; box-shadow: inset 0 2px 0 var(--accent); }
  .side nav .n { position: absolute; top: 2px; left: calc(50% + 16px); margin: 0; font-size: 10.5px; line-height: 15px; padding: 0 5px; }
  .side .foot { width: 100%; margin: 0; padding: 0; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 16px; }
  body.nodoc .side nav, body.nodoc .side > [data-new], body.connect .side .foot { display: none; }
  main .pagehead [data-new=expense] { display: none; } /* the floating one does it */
  .pagehead > :last-child:not(:first-child) { flex: none; white-space: nowrap; }
  main { padding: 8px 16px calc(150px + env(safe-area-inset-bottom, 0px)); }
  .pagehead { align-items: center; margin-bottom: 12px; }
  .pagehead h1 { font-size: 22px; }
  .pagehead p { font-size: 13px; }
  .tiles { gap: 8px; }
  .tile.hero { grid-column: 1 / -1; }
  .tile .v { font-size: 20px; }
  .grid { grid-template-columns: 1fr; }
  .toolbar input[type=search] { width: 100%; }
  .start { margin: 3vh auto; }
  .ph { display: revert; }
  .t .dt { display: none !important; } /* over the stacked-row rules below */
  .t, .t tbody, .t tfoot { display: block; }
  .t thead { display: none; }
  .t tbody tr, .t tfoot tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; padding: 11px 4px; border-bottom: 1px solid var(--rule); }
  .t tbody tr:last-child { border-bottom: 0; }
  .t td { display: block; padding: 0; border: 0; }
  .t tr.mon { display: block; padding: 10px 4px 4px; border: 0; }
  .t tr.mon td { padding: 0; background: none; }
  .t .c-wide { grid-column: 1 / -1; }
  .t .c-amt { text-align: right; font-weight: 650; }
  .t-act thead { display: block !important; }
  .t-act thead tr { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--rule-2); }

<body>
<div id="bar" hidden></div>
<div id="ribbon" class="ribbon" hidden>SAMPLE · invented figures · nothing entered here is saved <button type="button" data-act="gostart" data-only="laptop">Start my real budget</button></div>
<div class="shell">
  <aside class="side">
    <div class="brand">Budgets &amp; pay<small id="where"></small></div>
    <button class="primary" type="button" data-new="expense">+ Expense <kbd>N</kbd></button>
    <button class="ghost" type="button" data-new="balance">+ Balance from accounts <kbd>B</kbd></button>
    <button class="ghost" type="button" data-new="payslip">+ Payslip <kbd>P</kbd></button>
    <nav>
      <a href="#overview" data-view="overview">Overview<span class="n" id="todoCount" hidden></span></a>

    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script type="application/json" id="config">{"kind":"dropbox","appKey":"48f76egnljmhzf5","file":"/budget.json","redirect":"https://stormnwheel-coder.github.io/ledger/","api":"https://api.dropboxapi.com","content":"https://content.dropboxapi.com","www":"https://www.dropbox.com"}</script>
<script type="module">
import {
  localYmd, pad, MON, MONTH, parts, daysBetween, dShort, dLong, dFull, monthName, fyStart, fyLabel, days,
  IN0, IN2, rs, bare, sum, rupees, estimated, approx, chargedOn, byDate, stage, standing, esc,
  problems, RE_DATE, RE_MONTH, gross, net, ofKind, creditGap, buildModel,
  diffDocs, applyChanges, invert, entryKey, findEntry, sameEntry,
} from "./model.js?v=Ok7HKjjFO";
import { store } from "./store.js?v=Ok7HKjjFO";

const PHONE = store.kind === "phone";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const TODAY = localYmd(new Date());
const YESTERDAY = localYmd(new Date(Date.now() - 864e5));
const clone = o => structuredClone(o);
const newId = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const ago = d => { const n = daysBetween(d, TODAY); return n <= 0 ? "today" : n === 1 ? "yesterday" : `${n} days ago`; };
const fmtAvail = f => (f.available == null ? "not known yet" : approx(f.available, f.est));

/* Amounts may be typed with Indian or Western commas: "1,48,900", "148900.50". */
function parseAmount(s) {
  const t = String(s ?? "").replace(/[₹,\s]/g, "");
  if (!/^-?\d+(\.\d{1,2})?$/.test(t)) return null;
  return Number(t);
}
const amtText = n => (n == null ? "" : Number.isInteger(n) ? IN0.format(n) : IN2.format(n));

const ICON = {
  good: `<svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="6" fill="#0ca30c"/><path d="M3.4 6.2 5.2 8l3.4-3.7" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  warn: `<svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.2 11.3 10.6H.7Z" fill="#fab219" stroke="#fab219" stroke-width="1.2" stroke-linejoin="round"/><path d="M6 4.6v2.6" stroke="#0b0b0b" stroke-width="1.3" stroke-linecap="round"/><circle cx="6" cy="9" r=".75" fill="#0b0b0b"/></svg>`,
  crit: `<svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="6" fill="#d03b3b"/><path d="M6 3v3.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="6" cy="8.8" r=".95" fill="#fff"/></svg>`,
  wait: `<svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 3.3V6l1.8 1.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  todo: `<svg class="ic" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2.2 1.6"/></svg>`,
};
const flagHtml = ([kind, text]) => `<div class="flag">${ICON[kind]}<span>${esc(text)}</span></div>`;

const SOURCES = ["Accounts office statement", "Email from accounts", "Project ledger", "Sanction letter", "Allocation for the year"];

/* ------------------------------------------------------------------ *
 * State, loading and saving
 * ------------------------------------------------------------------ */
let S = { doc: null, etag: null, sample: false, missing: false, held: [] };
let M = null;
let browsingSample = false;
let connectInfo = null; // the phone, not signed in or with nothing read yet: what to say
const undoStack = []; // the changes each save made, newest last
const ui = {
  view: "overview", q: "", head: "all", stage: "all", fy: "all", salFy: null,
  sel: { claim: new Set(), reimb: new Set(), charge: new Set() }, fixed: {},
  last: { head: null, paidBy: "me", purpose: {} },
};

/* What the store calls: show(state) with a newer state (or, on the phone,
   with { connect } when there is nothing to show yet), status() for the line
   across the top, note() for a passing message, saved() for the status by
   the menu, busy() while the phone is checking Dropbox. */
const pageApi = {
  show(st) {
    if (st.connect) { connectInfo = st.connect; S = { doc: null, held: [] }; M = null; return render(); }
    connectInfo = null;
    adopt(st);
    // The entry an open form is changing has just been changed somewhere else.
    if (form?.opened && !stillAsOpened()) showBar("What this form is changing was just changed elsewhere. Close the form and open it again to see the change.", "warn");
  },
  status: (level, text, action) => showBar(text, level, action),
  note: toast,
  saved: setSaved,
  busy(on) { for (const b of $$(".refresh")) b.toggleAttribute("aria-busy", on); },
};
const stillAsOpened = () => sameEntry(form.opened.kind, form.opened.entry, findEntry(S.doc, form.opened.kind, form.opened.key));
/* A short fingerprint of the file's version, for the self-tests to watch. */
const fingerprint = s => { let h = 2166136261; for (const c of String(s || "")) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0; return h.toString(16); };
function adopt(st) {
  S = { held: [], ...st };
  M = S.doc ? buildModel(S.doc, TODAY) : null;
  if (PHONE) browsingSample = !!S.sample; // the phone can only look at the sample
  document.body.dataset.rev = fingerprint(S.etag);
  if (S.phone) $("#phoneLink").href = S.phone;
  setSaved(S.label || "", S.sample ? "busy" : "");
  render();
}

/* Every save is the whole new file; the store saves the entries it changed.
   If the file moved on since this page read it, the change is laid onto the
   new version, and saved if it still fits. */
async function commit(next, message, { isUndo = false } = {}) {
  if (S.sample || browsingSample) { toast(PHONE ? "This is the SAMPLE, so nothing is saved." : "This is the SAMPLE, so nothing is saved. Start your real budget to make entries.", "crit"); return false; }
  if (form?.opened && !stillAsOpened()) { toast("Not saved: what this form is changing was changed elsewhere while it was open. Close the form and open it again.", "crit"); return false; }
  const changes = diffDocs(S.doc, next);
  if (!changes.length) { toast("Nothing changed."); return true; }
  setSaved("Saving…", "busy");
  let r;
  try {
    r = await store.save(next, S.etag, message);
    if (r.conflict) {
      const re = applyChanges(r.state.doc, changes);
      if (!re.conflicts.length && !problems(re.doc).length) r = await store.save(re.doc, r.state.etag, message);
    }
  } catch { return false; } // the laptop's server has stopped; the store has said so
  if (r.conflict) {
    adopt(r.state);
    showBar("budget.json was changed outside this window, so the latest version has been loaded. Check that your last change is there, and make it again if not.", "warn");
    return false;
  }
  if (!r.ok) { setSaved("Not saved", "bad"); toast(r.error || "Not saved.", "crit"); return false; }
  if (!isUndo) undoStack.push(changes);
  adopt(r.state);
  setSaved(r.saved || `All changes saved · ${new Date().toTimeString().slice(0, 5)}`);
  toast(message, "", !isUndo && undoStack.length > 0);
  return true;
}
/* Undo takes back the last save's own changes, and nothing made since elsewhere. */
async function undo() {
  if (!undoStack.length) return toast("Nothing to undo.");
  const r = applyChanges(S.doc, invert(undoStack.at(-1)));
  if (r.conflicts.length) { undoStack.pop(); return toast("Can't undo: that entry has been changed since.", "crit"); }
  if (await commit(r.doc, "Undone.", { isUndo: true })) undoStack.pop();
}

function setSaved(text, cls = "") { $("#savedText").textContent = text; $("#saved").className = cls; }
function showBar(text, cls, action) {
  const b = $("#bar");
  b.hidden = !text;
  b.className = cls || "";
  b.innerHTML = text ? `<span>${esc(text)}</span>${action ? `<button type="button" data-act="${esc(action.act)}">${esc(action.label)}</button>` : ""}` : "";
}
let toastTimer;
function toast(text, cls = "", withUndo = false) {
  const t = $("#toast");
  t.className = cls;
  t.innerHTML = `<span>${esc(text)}</span>${withUndo ? `<button type="button" data-act="undo">Undo</button>` : ""}`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), cls === "crit" ? 9000 : 6000);
}

/* ------------------------------------------------------------------ *
 * Rendering
 * ------------------------------------------------------------------ */
const VIEWS = ["overview", "expenses", "balances", "salary", "heads"];
function render() {
  document.body.classList.toggle("nodoc", !S.doc);
  document.body.classList.toggle("connect", !!connectInfo);
  $("#ribbon").hidden = !(S.sample && browsingSample);
  document.body.classList.toggle("readonly", !!S.sample);
  if (connectInfo) { $("#main").innerHTML = connectView(); return; }
  if (!S.doc || (S.sample && !browsingSample)) { $("#main").innerHTML = startView(); return; }
  const v = VIEWS.includes(ui.view) ? ui.view : "overview";
  $("#main").innerHTML = { overview: overviewView, expenses: expensesView, balances: balancesView, salary: salaryView, heads: headsView }[v]();
  for (const a of $$("[data-view]")) { if (a.dataset.view === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  const todo = M.unclaimed.length + M.claimed.length + uncharged().length;
  $("#todoCount").hidden = !todo;
  $("#todoCount").textContent = todo;
  document.title = `${v[0].toUpperCase() + v.slice(1)} · Budgets & pay`;
}
const uncharged = () => S.doc.expenses.filter(e => e.paidBy === "institute" && !e.charged).sort(byDate);
const headName = id => S.doc.heads.find(h => h.id === id)?.name || id;
const pageHead = (title, sub, right = "") => `<div class="pagehead"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${right}</div>`;

function startView() {
  if (!store.starter) return `<div class="start card"><h1>No budget yet</h1>
    <p>There is no budget file in Dropbox yet. Start your real budget in the laptop app; it shows here after that.</p></div>`;
  const replacing = S.sample;
  return `<div class="start card">
    <h1>Start your real budget</h1>
    <p>${replacing
      ? "The phone is showing the invented <b>SAMPLE</b> at the moment. Starting replaces it with your own file, holding only the heads you tick below. The phone shows your real budget the next time it is opened."
      : "There is no budget file yet. Starting creates one, holding only the heads you tick below."}
      Every figure is yours to enter next: balances from accounts, expenses and payslips. Heads can be renamed, added or removed later.</p>
    <form id="startForm">
      ${store.starter.map((h, i) => `<label class="row"><input type="checkbox" name="h" value="${i}" checked>
        <span><b>${esc(h.name)}</b>${h.code ? ` <span class="note">${esc(h.code)}</span>` : ""}${h.usedFor ? `<br><span class="note">${esc(h.usedFor)}</span>` : ""}</span>
        <span class="kind">${h.kind === "finite" ? "has a budget" : "use-restricted, no limit"}</span></label>`).join("")}
      <div class="btns">
        <button class="primary" type="submit">Start my real budget</button>
        ${replacing ? `<button class="ghost" type="button" data-act="browse">Look around the sample first</button>` : ""}
      </div>
    </form>
  </div>`;
}

/* The phone, before anything can be shown. */
function connectView() {
  const c = connectInfo;
  return `<div class="start card">
    <h1>Budgets &amp; pay</h1>
    <p>Your figures stay in your Dropbox. Sign in once and this phone stays signed in. The app can see only its own folder in your Dropbox, where your budget is kept.</p>
    ${c.message ? `<p class="${c.isError ? "formerr" : "note"}" id="cmsg">${esc(c.message)}</p>` : ""}
    <div class="btns">${c.signedIn
      ? `<button class="primary" type="button" data-act="refresh" ${c.checking ? "disabled" : ""}>Check again</button><button class="ghost" type="button" data-act="signout">Sign out</button>`
      : `<button class="primary" type="button" data-act="signin" id="signInBtn">Sign in with Dropbox</button>`}</div>
  </div>`;
}

/* --- Changes from the phone that clash with the laptop's -------------- */
function entryLabel(kind, x) {
  try {
    return kind === "expense" ? `“${x.item}”, ${approx(rupees(x), estimated(x))}` : kind === "head" ? `the head “${x.name}”`
      : kind === "statement" ? `the ${headName(x.head)} balance of ${dShort(x.asOn)}` : `the ${monthName(x.month)} payslip`;
  } catch { return "an entry"; } // a change file is checked, but this must never stop the page drawing
}
const madeText = iso => { const d = new Date(iso); return Number.isNaN(+d) ? "" : `${dShort(localYmd(d))}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function heldCard() {
  if (!S.held?.length) return "";
  const row = h => {
    const why = h.why === "conflict"
      ? (h.conflicts || []).map(c => `<div class="sub">${esc(entryLabel(c.kind, c.after || c.before))}: ${c.current ? "changed on the laptop after the phone read it" : "deleted on the laptop after the phone read it"}.</div>`).join("")
      : h.why === "invalid" ? `<div class="sub">It no longer fits the file: ${esc((h.problems || [])[0] || "")}.</div>`
      : `<div class="sub">The file it came in could not be read (${esc((h.problems || [])[0] || "")}).</div>`;
    const buttons = !store.decide ? "" : `<div class="chips" style="margin-top:6px">
      ${h.why === "conflict" ? `<button class="mini" type="button" data-decide="apply" data-id="${esc(h.id)}">Use the phone's version</button>` : ""}
      <button class="mini" type="button" data-decide="discard" data-id="${esc(h.id)}">${h.why === "conflict" ? "Keep the laptop's" : "Set it aside"}</button></div>`;
    return `<div class="held-row"><b>${esc(h.note || "A change")}</b>${h.made ? ` <span class="note">made on the phone ${esc(madeText(h.made))}</span>` : ""}${why}${buttons}</div>`;
  };
  return `<section class="card held" id="held"><h2 class="sec" style="margin-top:0">From the phone: needs a decision <span>${plural(S.held.length, "change")}</span></h2>
    ${S.held.map(row).join("")}${store.decide ? "" : `<div class="note" style="margin-top:6px">Open the laptop app to decide.</div>`}</section>`;
}

/* --- Overview ------------------------------------------------------ */
function gettingStarted() {
  const finite = S.doc.heads.filter(h => h.kind === "finite" && !h.closed);
  const noBal = finite.filter(h => !S.doc.statements.some(s => s.head === h.id));
  const steps = [
    [!noBal.length, `Enter the latest balance from accounts for each budget head${noBal.length ? ` (${noBal.length} of ${finite.length} still to do)` : ""}.`,
      noBal.length ? `<div class="chips">${noBal.map(h => `<button class="chip" type="button" data-new="balance" data-head="${esc(h.id)}">+ ${esc(h.name)}</button>`).join("")}</div>` : ""],
    [S.doc.expenses.length > 0, "Enter the expenses that are not in those balances yet: claims you are waiting on, things not claimed yet, and institute bookings not yet charged. Older, settled ones are optional, for the record.",
      `<div class="chips"><button class="chip" type="button" data-new="expense">+ Expense</button></div>`],
    [S.doc.payslips.length > 0, "Add your latest payslip.", `<div class="chips"><button class="chip" type="button" data-new="payslip">+ Payslip</button></div>`],
  ];
  if (steps.every(s => s[0])) return "";
  return `<div class="card" style="margin-bottom:16px"><h2 class="sec" style="margin-top:0">Getting started</h2><div class="steps">${steps.map(([ok, text, extra]) =>
    `<div class="st${ok ? " ok" : ""}">${ok ? ICON.good : ICON.todo}<div>${esc(text)}${ok ? "" : extra}</div></div>`).join("")}</div></div>`;
}

const LISTS = {
  claim: { title: "Claim these", sub: "You paid, and have not claimed yet", field: "claimed", verb: "Mark claimed", done: "claimed",
    rows: () => M.unclaimed, when: e => `paid ${ago(e.date)}`, empty: "Nothing to claim." },
  reimb: { title: "Waiting to be reimbursed", sub: "Claimed, not paid back yet. Oldest claim first.", field: "reimbursed", verb: "Mark reimbursed", done: "reimbursed",
    rows: () => M.claimed, when: e => (e.claimed === TODAY ? "claimed today" : `claimed ${dShort(e.claimed)}, waiting ${days(daysBetween(e.claimed, TODAY))}`), empty: "Nothing waiting." },
  charge: { title: "Institute bookings not charged yet", sub: "Booked through the institute, not yet charged to the head", field: "charged", verb: "Mark charged", done: "charged",
    rows: uncharged, when: e => `booked ${ago(e.date)}`, empty: "Nothing outstanding." },
};

function actCard(key) {
  const L = LISTS[key], rows = L.rows(), sel = ui.sel[key];
  for (const id of sel) if (!rows.some(e => e.id === id)) sel.delete(id);
  const total = approx(sum(rows, rupees), rows.some(estimated));
  if (!rows.length) return `<section class="card act-card" id="list-${key}"><header><div><h3>${L.title}</h3></div></header><div class="done">${ICON.good}${L.empty}</div></section>`;
  const picked = rows.filter(e => sel.has(e.id));
  return `<section class="card act-card" id="list-${key}">
    <header><div><h3>${L.title}<span class="count">${plural(rows.length, "item")} · ${total}</span></h3><p>${L.sub}</p></div></header>
    <table class="t t-act"><thead><tr><th class="ck"><input type="checkbox" data-all="${key}" aria-label="Select all" ${picked.length === rows.length ? "checked" : ""}></th>
      <th class="ph">Select all</th><th class="dt">Date</th><th class="dt">Head</th><th class="dt">Item</th><th class="r dt">Amount</th><th class="act dt"></th></tr></thead>
    <tbody>${rows.map(e => `<tr data-edit="${esc(e.id)}">
      <td class="ck"><input type="checkbox" data-pick="${key}" value="${esc(e.id)}" ${sel.has(e.id) ? "checked" : ""} aria-label="Select ${esc(e.item)}"></td>
      <td class="nowrap dt">${dShort(e.date)}</td><td class="nowrap dt">${esc(headName(e.head))}</td>
      <td>${esc(e.item)}<div class="sub"><span class="ph">${dShort(e.date)} · ${esc(headName(e.head))} · </span>${e.purpose ? `${esc(e.purpose)} · ` : ""}${L.when(e)}${e.foreign ? ` · ${esc(e.foreign.currency)} ${IN2.format(e.foreign.amount)}` : ""}</div>
        ${key === "reimb" && estimated(e) ? `<label class="fix">Rupee amount paid back ₹ <input data-fix="${esc(e.id)}" inputmode="decimal" value="${esc(ui.fixed[e.id] || "")}" placeholder="≈ ${bare(rupees(e))}"></label>` : ""}</td>
      <td class="r c-amt">${estimated(e) ? "≈ " : ""}${rs(rupees(e))}</td>
      <td class="r c-act"><button class="mini hov" type="button" data-quick="${key}" data-id="${esc(e.id)}">${L.done[0].toUpperCase() + L.done.slice(1)} today</button></td>
    </tr>`).join("")}</tbody></table>
    <div class="bulk" ${picked.length ? "" : "hidden"}><b>${picked.length} selected</b> · ${approx(sum(picked, rupees), picked.some(estimated))}
      <span>· ${L.verb.toLowerCase()} on</span><input type="date" data-bulkdate="${key}" value="${TODAY}" max="${TODAY}">
      <button class="primary" type="button" data-bulk="${key}">${L.verb}</button>
      <button class="link" type="button" data-clear="${key}">Clear</button></div>
  </section>`;
}

function meter(f) {
  if (f.usedShare == null) return "";
  const w = Math.max(0, Math.min(100, f.usedShare * 100));
  return `<div class="meter ${f.state}"><i style="width:${w.toFixed(1)}%"></i></div>`;
}
function headCard(f) {
  const h = f.h;
  if (h.kind === "open") {
    return `<div class="card hcard" data-goto="balances" data-head="${esc(h.id)}">
      <div class="top"><span class="name">${esc(h.name)}</span><span class="meta">${plural(f.fy.length, "item")}</span></div>
      <div class="big">${approx(f.total, f.est)}</div><div class="lbl">spent in FY ${fyLabel(TODAY)}</div>
      ${f.purposes.slice(0, 3).map(([p, x]) => `<div class="meta">${esc(p)} · ${approx(x.total, x.est)}</div>`).join("")}
      ${f.flags.map(flagHtml).join("")}</div>`;
  }
  const used = f.usedShare == null ? "" : `${Math.max(0, Math.round(f.usedShare * 100))}% used of ${rs(h.total)}`;
  const end = h.validTill ? `ends ${dLong(h.validTill)}` : "";
  return `<div class="card hcard" data-goto="balances" data-head="${esc(h.id)}">

function expenseMatches() {
  const words = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
  return S.doc.expenses.filter(e => {
    if (ui.head !== "all" && e.head !== ui.head) return false;
    if (ui.stage !== "all" && stage(e) !== ui.stage) return false;
    if (ui.fy !== "all" && fyStart(e.date) !== ui.fy) return false;
    const hay = [e.item, e.purpose, headName(e.head), e.foreign?.currency, String(rupees(e)), bare(rupees(e)), monthName(e.date.slice(0, 7))].join(" ").toLowerCase();
    return words.every(w => hay.includes(w));
  }).sort((a, b) => -byDate(a, b) || (a.id < b.id ? 1 : -1));
}
function expenseTable() {
  const xs = expenseMatches();
  if (!xs.length) return `<div class="empty" style="padding:14px 10px">${S.doc.expenses.length ? "Nothing matches." : "No expenses yet."}</div>`;
  let month = "";
  const rows = xs.map(e => {
    const m = e.date.slice(0, 7);
    const head = m !== month ? `<tr class="mon"><td colspan="6">${monthName(m)}</td></tr>` : "";
    month = m;
    const [kind, words] = standing(e, TODAY);
    const quick = stage(e) === "toclaim" ? ["claim", "Claimed today"] : stage(e) === "waiting" ? (e.paidBy === "me" ? ["reimb", "Reimbursed today"] : ["charge", "Charged today"]) : null;
    const sub = [e.purpose && esc(e.purpose), e.foreign && `${esc(e.foreign.currency)} ${IN2.format(e.foreign.amount)} at ₹${IN2.format(e.foreign.rate)}`].filter(Boolean).join(" · ");
    return `${head}<tr data-edit="${esc(e.id)}">
      <td class="nowrap dt">${dShort(e.date)}</td><td class="nowrap dt">${esc(headName(e.head))}</td>
      <td>${esc(e.item)}<div class="sub"><span class="ph">${dShort(e.date)} · ${esc(headName(e.head))} · ${e.paidBy === "me" ? "you paid" : "institute paid"}${sub ? " · " : ""}</span>${sub}</div></td>
      <td class="r c-amt">${estimated(e) ? "≈ " : ""}${rs(rupees(e))}</td>
      <td class="nowrap dt">${e.paidBy === "me" ? "You" : "Institute"}</td>
      <td class="c-wide"><span class="flag" style="margin:0">${ICON[kind]}<span>${esc(words)}</span></span>
        ${quick ? `<button class="mini hov" type="button" data-quick="${quick[0]}" data-id="${esc(e.id)}" style="margin-top:4px">${quick[1]}</button>` : ""}</td></tr>`;
  }).join("");
  return `<table class="t"><thead><tr><th>Date</th><th>Head</th><th>Item</th><th class="r">Amount</th><th>Paid by</th><th>Where it stands</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td colspan="3">${plural(xs.length, "expense")}</td><td class="r c-amt">${approx(sum(xs, rupees), xs.some(estimated))}</td><td colspan="2" class="dt"></td></tr></tfoot></table>`;
}

/* --- Balances ------------------------------------------------------ */
/* How "available now" is reached: the latest balance, less each expense not yet in it. */
function workingOut(f) {
  if (f.available == null) return "";
  const base = f.last ? `Balance from accounts, ${dLong(f.last.asOn)}` : "Total budget (no balance from accounts yet)";
  return `<details class="working"><summary>How “available now” is worked out</summary>
    <div class="l"><span>${base}</span><span>${rs(f.last ? f.last.balance : f.h.total)}</span></div>
    ${f.pending.map(e => `<div class="l minus"><span>− ${esc(e.item)}, ${dShort(e.date)} · ${esc(standing(e, TODAY)[1])}</span><span>${estimated(e) ? "≈ " : ""}${bare(rupees(e))}</span></div>`).join("")}
    <div class="l total"><span>Available now</span><span>${approx(f.available, f.est)}</span></div>
    <div class="note">Taken off: expenses not yet in that balance, meaning claims not yet reimbursed and institute bookings not yet charged${f.last ? ", and anything settled after it" : ""}.</div></details>`;
}

/* ------------------------------------------------------------------ *
 * The drawer and its forms
 * ------------------------------------------------------------------ */
let form = null; // { el, dirty, submit(kind) }
function openDrawer(html, submit, after) {
  const d = $("#drawer");
  d.innerHTML = `<form novalidate>${html}</form>`;
  d.hidden = false; $("#scrim").hidden = false;
  form = { el: $("form", d), dirty: false, submit };
  form.el.addEventListener("input", () => (form.dirty = true));
  form.el.addEventListener("submit", ev => { ev.preventDefault(); form.submit(ev.submitter?.value || "save"); });
  after?.(form.el);
  const first = $("[autofocus]", form.el) || $("input:not([type=radio]):not([type=checkbox]), select", form.el);
  first?.focus();
}
function closeDrawer(force = false) {
  if (!form) return;
  if (!force && form.dirty && !confirm("Close without saving what you typed?")) return;
  $("#drawer").hidden = true; $("#scrim").hidden = true; $("#drawer").innerHTML = ""; form = null;
}
const drawerHead = title => `<h2><span>${title}</span><button class="x" type="button" data-act="close" aria-label="Close">×</button></h2>`;
const fieldErr = (el, msg) => { el.classList.add("bad"); const f = el.closest(".field"); if (f && !$(".err", f)) f.insertAdjacentHTML("beforeend", `<div class="err">${esc(msg)}</div>`); };
const clearErrs = el => { $$(".bad", el).forEach(x => x.classList.remove("bad")); $$(".err, .formerr", el).forEach(x => x.remove()); };
const formError = (el, msg) => { $(".formerr", el)?.remove(); el.insertAdjacentHTML("afterbegin", `<div class="formerr">${esc(msg)}</div>`); };
const datalist = (id, values) => `<datalist id="${id}">${[...new Set(values.filter(Boolean))].map(v => `<option value="${esc(v)}">`).join("")}</datalist>`;
const deleteButton = () => `<button class="danger" type="button" data-act="delete">Delete</button>`;
/* A delete takes two clicks: the first arms the button, the second deletes. */
function armDelete(btn, run) {
  if (btn.classList.contains("armed")) return run();
  const label = btn.textContent;
  btn.classList.add("armed"); btn.textContent = "Click again to delete";
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = label; } }, 4000);
}

      $("#dlPurpose", el).innerHTML = [...new Set(S.doc.expenses.filter(x => x.head === head?.id && x.purpose).map(x => x.purpose))].map(v => `<option value="${esc(v)}">`).join("");
      const fxOn = el.elements.cur.value === "fx";
      $("#inrBox", el).hidden = fxOn; $("#fxBox", el).hidden = !fxOn;
      const mine = el.elements.paidBy.value === "me";

      for (const k of ["claimed", "reimbursed", "charged"]) {
        const box = el.elements["has" + k[0].toUpperCase() + k.slice(1)], d = el.elements[k];
        d.disabled = !box.checked;
        if (box.checked && !d.value) d.value = TODAY;
      }
      const fa = parseAmount(el.elements.famount.value), rt = parseAmount(el.elements.rate.value);
      $("#fxEst", el).textContent = fa != null && rt ? `Until then it counts as ≈ ${rs(fa * rt)} (${IN2.format(fa)} × ₹${rt}).` : "";
      const r = readExpense(el, existing, true);
      $("#impact", el).innerHTML = r.e ? impactHtml(r.e, existing) : `<span class="note">Fill in the head and amount to see the effect.</span>`;
    };
    el.addEventListener("input", sync);
    el.addEventListener("change", ev => {
      if (ev.target.name === "head" && !existing) {
        const p = ui.last.purpose[ev.target.value];
        if (p && !el.elements.purpose.value) el.elements.purpose.value = p;
      }
      if (ev.target.name === "currency" && !existing) {
        const c = ev.target.value.trim().toUpperCase();
        const prev = [...S.doc.expenses].reverse().find(x => x.foreign?.currency === c);
        if (prev && !el.elements.rate.value) el.elements.rate.value = prev.foreign.rate; // the rate he used last time, to change if it moved
      }
      sync();
    });
    el.addEventListener("click", ev => { const b = ev.target.closest("[data-setdate]"); if (b) { el.elements.date.value = b.dataset.setdate; sync(); } });
    sync();
  });
}

function readExpense(el, existing, quiet = false) {
  const v = n => (el.elements[n]?.value ?? "").trim();
  const errs = [];
  const head = S.doc.heads.find(h => h.id === el.elements.head.value);
  // The field is "itemName", not "item": form.elements.item is a built-in method, so a field called "item" cannot be read by name.
  const e = { id: existing?.id || newId(), head: head?.id, date: v("date"), item: v("itemName"), paidBy: el.elements.paidBy.value };
  if (v("purpose")) e.purpose = v("purpose");
  if (!head) errs.push(["head", "Choose a head."]);
  if (!RE_DATE.test(e.date)) errs.push(["date", "Enter the date."]);
  if (!e.item) errs.push(["itemName", "Say what it was."]);
  if (head?.kind === "open" && !e.purpose) errs.push(["purpose", `${head.name} can only be used for its purpose, so say which.`]);
  if (el.elements.cur.value === "inr") {
    e.inr = parseAmount(v("inr"));
    if (e.inr == null) errs.push(["inr", "Enter the amount in rupees, e.g. 14,250."]);
  } else {
    const currency = v("currency").toUpperCase(), amount = parseAmount(v("famount")), rate = parseAmount(v("rate"));
    if (!/^[A-Z]{3}$/.test(currency)) errs.push(["currency", "A three-letter code, e.g. USD."]);
    if (amount == null) errs.push(["famount", "Enter the amount."]);
    if (!rate || rate <= 0) errs.push(["rate", "Enter the rate in rupees."]);
    e.foreign = { currency, amount, rate };
    e.inr = v("inrFixed") ? parseAmount(v("inrFixed")) : null;
    if (v("inrFixed") && e.inr == null) errs.push(["inrFixed", "Enter a rupee amount, or leave it empty."]);
  }
  const stamp = k => { if (el.elements["has" + k[0].toUpperCase() + k.slice(1)].checked) { e[k] = v(k); if (!RE_DATE.test(e[k])) errs.push([k, "Enter the date."]); } };
  if (e.paidBy === "me") { stamp("claimed"); stamp("reimbursed"); } else stamp("charged");
  if (e.claimed && e.claimed < e.date) errs.push(["claimed", "The claim is dated before the expense."]);
  if (e.reimbursed && e.claimed && e.reimbursed < e.claimed) errs.push(["reimbursed", "Reimbursed before it was claimed?"]);
  if (e.reimbursed && e.foreign && e.inr == null) errs.push(["inrFixed", "Enter the rupee amount paid back: it is fixed once reimbursed."]);
  if (quiet) return { e: errs.some(([k]) => ["head", "inr", "famount", "rate", "currency"].includes(k)) ? null : e };
  return { e, errs };
}

function impactHtml(e, existing) {
  const next = clone(S.doc);
  if (existing) next.expenses = next.expenses.filter(x => x.id !== existing.id);
  next.expenses.push(e);
  if (problems(next).length) return `<span class="note">Fill in the rest to see the effect.</span>`;
  const after = buildModel(next, TODAY), lines = [];
  for (const id of new Set([existing?.head, e.head].filter(Boolean))) {
    const b = M.heads.find(x => x.h.id === id), a = after.heads.find(x => x.h.id === id);
    if (!b || !a) continue;
    lines.push(b.h.kind === "finite"
      ? `<div>${esc(b.h.name)}: available now <b>${fmtAvail(b)}</b> → <b>${fmtAvail(a)}</b></div>`
      : `<div>${esc(b.h.name)}, spent in FY ${fyLabel(TODAY)}: <b>${approx(b.total, b.est)}</b> → <b>${approx(a.total, a.est)}</b></div>`);
  }
  const owedB = sum(M.mine, rupees), owedA = sum(after.mine, rupees);
  if (owedA !== owedB) lines.push(`<div>Owed to you: <b>${rs(owedB)}</b> → <b>${rs(owedA)}</b></div>`);
  return lines.join("") || `<span class="note">No change to any balance.</span>`;
}

async function saveExpense(kind, existing) {
  const el = form.el;
  clearErrs(el);
  const { e, errs } = readExpense(el, kind === "copy" ? null : existing);
  if (errs.length) { for (const [n, msg] of errs) { const f = el.elements[n]; if (f?.classList) fieldErr(f, msg); else formError(el, msg); } return; }
  const next = clone(S.doc);
  if (existing && kind !== "copy") next.expenses = next.expenses.map(x => (x.id === existing.id ? e : x));
  else next.expenses.push(e);
  ui.last = { ...ui.last, head: e.head, paidBy: e.paidBy, purpose: { ...ui.last.purpose, ...(e.purpose ? { [e.head]: e.purpose } : {}) } };
  const ok = await commit(next, existing && kind !== "copy" ? `Changed “${e.item}”.` : `Added “${e.item}”, ${approx(rupees(e), estimated(e))} on ${headName(e.head)}.`);
  if (!ok) return;
  closeDrawer(true);
  if (kind === "again") expenseForm(null, { head: e.head, date: e.date, paidBy: e.paidBy, purpose: e.purpose || "" });
}
async function deleteExpense(id) {
  const e = S.doc.expenses.find(x => x.id === id);
  const next = clone(S.doc);
  next.expenses = next.expenses.filter(x => x.id !== id);
  if (await commit(next, `Deleted “${e.item}”.`)) closeDrawer(true);
}

/* --- Marking claimed, reimbursed or charged, one or many ------------ */
async function markDone(key, ids, date) {
  const L = LISTS[key];
  if (!RE_DATE.test(date || "")) return toast("Choose the date first.", "crit");
  const next = clone(S.doc);
  for (const id of ids) {
    const e = next.expenses.find(x => x.id === id);
    if (key === "reimb" && e.inr == null) {
      const v = parseAmount(ui.fixed[id]);
      if (v == null) { toast(`Enter the rupee amount paid back for “${e.item}” first.`, "crit"); $(`[data-fix="${CSS.escape(id)}"]`)?.focus(); return; }
      e.inr = v;
    }
    if (key === "claim" && date < e.date) return toast(`“${e.item}” is dated ${dShort(e.date)}, after that claim date.`, "crit");
    if (key === "reimb" && e.claimed && date < e.claimed) return toast(`“${e.item}” was claimed on ${dShort(e.claimed)}, after that date.`, "crit");
    e[L.field] = date;
  }
  const one = ids.length === 1 ? `“${next.expenses.find(x => x.id === ids[0]).item}”` : plural(ids.length, "expense");
  if (await commit(next, `${one} marked ${L.done} on ${dShort(date)}.`)) { ui.sel[key].clear(); for (const id of ids) delete ui.fixed[id]; render(); }
}

function balanceForm(existing = null, preset = {}) {

  openDrawer(html, () => saveBalance(existing), el => {
    const sync = () => {
      const r = readBalance(el, existing);

      next.statements.push(r.s);
      const a = buildModel(next, TODAY).heads.find(x => x.h.id === r.s.head), b = M.heads.find(x => x.h.id === r.s.head);

           ${Math.round(c.gap) === 0 ? flagHtml(["good", "Matches exactly."]) : flagHtml(["warn", `${rs(Math.abs(c.gap))} ${c.gap < 0 ? "below" : "above"} what was expected${c.gap < 0 ? ": accounts may have charged something not recorded here." : ": a top-up, or a charge reversed?"}`])}`;
      $("#impact", el).innerHTML = `${check}<div>Available now: <b>${fmtAvail(b)}</b> → <b>${fmtAvail(a)}</b></div>`;

function readBalance(el) {

  return { s: errs.length ? null : s, errs, raw: s };
}
async function saveBalance(existing) {
  const el = form.el;

async function deleteBalance(existing) {

  if (await commit(next, `Deleted the ${headName(existing.head)} balance of ${dShort(existing.asOn)}.`)) closeDrawer(true);
}

/* --- Payslip form -------------------------------------------------- */
const KINDS = [["tax", "Income tax"], ["retirement", "NPS / PF"], ["other", "Other"]];
function nextMonth(ym) { let [y, m] = parts(ym); m++; if (m > 12) { m = 1; y++; } return `${y}-${pad(m)}`; }
function payslipForm(existing = null) {
  const last = M.latest;
  const copied = !existing && last;
  const p = existing ? clone(existing) : copied
    ? { month: nextMonth(last.month), earnings: clone(last.earnings), deductions: clone(last.deductions) }
    : { month: TODAY.slice(0, 7), earnings: [{ label: "", amount: null }], deductions: [{ label: "", amount: null, kind: "tax" }] };
  const eRow = x => `<div class="line3"><input name="eLabel" value="${esc(x.label)}" placeholder="e.g. Basic pay" aria-label="Earning"><input class="amt" name="eAmt" inputmode="decimal" value="${amtText(x.amount)}" placeholder="₹" aria-label="Amount"><button class="rm" type="button" data-rm aria-label="Remove line">×</button></div>`;
  const dRow = x => `<div class="line4"><input name="dLabel" value="${esc(x.label)}" placeholder="e.g. Income tax (TDS)" aria-label="Deduction"><input class="amt" name="dAmt" inputmode="decimal" value="${amtText(x.amount)}" placeholder="₹" aria-label="Amount">
    <select name="dKind" aria-label="Kind">${KINDS.map(([k, t]) => `<option value="${k}" ${x.kind === k ? "selected" : ""}>${t}</option>`).join("")}</select><button class="rm" type="button" data-rm aria-label="Remove line">×</button></div>`;
  const html = `${drawerHead(existing ? `Payslip, ${monthName(existing.month)}` : "New payslip")}
    ${copied ? `<div class="impact"><div>The lines are copied from <b>${monthName(last.month)}</b>, as a start. Change whatever differs this month.</div><div><button class="link" type="button" data-act="blankslip">Start blank instead</button></div></div>` : ""}
    <div class="field"><label for="fMonth">Month</label><input type="month" id="fMonth" name="month" value="${p.month}" ${existing ? "" : "autofocus"}></div>
    <div class="field"><span class="lab">Earnings</span><div class="lines" id="eLines">${p.earnings.map(eRow).join("")}</div><button class="link" type="button" data-addline="e">+ Earning</button></div>
    <div class="field"><span class="lab">Deductions</span><div class="lines" id="dLines">${p.deductions.map(dRow).join("")}</div><button class="link" type="button" data-addline="d">+ Deduction</button>
      <div class="hint">The kind is how the phone finds income tax and NPS / PF for the year.</div></div>
    <div class="totals"><div><span>Gross</span><b id="tGross"></b></div><div><span>Deductions</span><b id="tDed"></b></div><div><span>Take-home</span><b id="tNet"></b></div></div>
    <div class="field"><span class="lab">Credited to the bank</span><div class="row2"><input type="date" name="cDate" value="${p.credited?.date || ""}" aria-label="Date credited"><input class="amt" name="cAmt" inputmode="decimal" value="${amtText(p.credited?.amount)}" placeholder="₹ as the bank shows it" aria-label="Amount credited"></div><div class="hint" id="cCheck"></div></div>
    <div class="field"><span class="lab">Payslip PDF</span>${p.file ? `<div class="note">Attached. <button class="link" type="button" data-openslip="${p.month}">Open it</button>. Choose another file to replace it.</div>` : ""}
      <input type="file" name="pdf" accept="application/pdf"><div class="hint">Kept beside budget.json, as payslips/${p.month}.pdf.</div></div>
    <div class="btnrow"><button class="primary" type="submit" value="save">Save <kbd>⌘↵</kbd></button><span class="grow"></span>${existing ? deleteButton() : ""}</div>`;
  openDrawer(html, () => savePayslip(existing), el => {
    const sync = () => {
      const r = readPayslip(el);
      const g = sum(r.p.earnings, x => x.amount || 0), d = sum(r.p.deductions, x => x.amount || 0);
      $("#tGross", el).textContent = rs(g); $("#tDed", el).textContent = rs(d); $("#tNet", el).textContent = rs(g - d);
      const c = parseAmount(el.elements.cAmt.value);
      $("#cCheck", el).innerHTML = c == null ? "" : Math.round(c - (g - d)) === 0 ? flagHtml(["good", "Matches the take-home."]) : flagHtml(["warn", `${rs(Math.abs(c - (g - d)))} ${c < g - d ? "less" : "more"} than the take-home.`]);

    el.addEventListener("click", ev => {

function payslipBlank() {
  const last = M.latest;
  M.latest = null;
  try { payslipForm(); } finally { M.latest = last; }
  if (last) form.el.elements.month.value = nextMonth(last.month);
}
function readPayslip(el) {
  const vals = name => $$(`[name="${name}"]`, el).map(x => x.value.trim());
  const eL = vals("eLabel"), eA = vals("eAmt"), dL = vals("dLabel"), dA = vals("dAmt"), dK = vals("dKind");
  const errs = [];
  // A line left completely empty is ignored; a half-filled one is an error.
  const p = {
    month: el.elements.month.value,
    earnings: eL.map((label, i) => ({ label, amount: parseAmount(eA[i]), raw: eA[i] })).filter(x => x.label || x.raw),
    deductions: dL.map((label, i) => ({ label, amount: parseAmount(dA[i]), kind: dK[i], raw: dA[i] })).filter(x => x.label || x.raw),
  };
  if (!RE_MONTH.test(p.month)) errs.push("Choose the month.");
  if (!p.earnings.length) errs.push("Add at least one earning.");
  for (const x of [...p.earnings, ...p.deductions]) { if (!x.label) errs.push("Every line needs a name."); if (x.amount == null) errs.push(`Enter an amount for “${x.label || "a line"}”.`); }
  for (const x of [...p.earnings, ...p.deductions]) delete x.raw;
  const cDate = el.elements.cDate.value, cAmt = el.elements.cAmt.value.trim();
  if (cDate || cAmt) {
    if (!RE_DATE.test(cDate) || parseAmount(cAmt) == null) errs.push("For the bank credit, give both the date and the amount (or neither).");
    else p.credited = { date: cDate, amount: parseAmount(cAmt) };
  }
  return { p, errs: [...new Set(errs)] };
}
async function savePayslip(existing) {
  const el = form.el;
  clearErrs(el);
  const { p, errs } = readPayslip(el);
  if (errs.length) return formError(el, errs.join(" "));
  if (S.doc.payslips.some(x => x.month === p.month && x.month !== existing?.month)) return formError(el, `There is already a payslip for ${monthName(p.month)}. Open that one to change it.`);
  if (existing?.file && existing.month === p.month) p.file = existing.file;
  const pdf = el.elements.pdf.files[0];
  if (pdf) {
    if (S.sample || browsingSample) return toast("This is the SAMPLE, so nothing is saved.", "crit");
    let r;
    try { r = await store.putPayslip(p.month, pdf); } catch { return; } // the laptop's server has stopped; the store has said so
    if (r.error) return formError(el, r.error);
    p.file = r.file;
  }
  const next = clone(S.doc);
  next.payslips = next.payslips.filter(x => x.month !== existing?.month).concat(p);
  if (await commit(next, `${existing ? "Changed" : "Added"} the ${monthName(p.month)} payslip: take-home ${rs(net(p))}.`)) closeDrawer(true);
}
async function deletePayslip(existing) {
  const next = clone(S.doc);
  next.payslips = next.payslips.filter(x => x.month !== existing.month);
  if (await commit(next, `Deleted the ${monthName(existing.month)} payslip.`)) closeDrawer(true);
}

    <div class="row2" id="finBox"><div class="field"><label for="fTotal">Total for the current period (optional)</label><input class="amt" id="fTotal" name="total" inputmode="decimal" value="${amtText(h.total)}" placeholder="₹"><div class="hint">What “% used” is measured against.</div></div>
      <div class="field"><label for="fTill">Valid till (optional)</label><input type="date" id="fTill" name="validTill" value="${h.validTill || ""}"></div></div>
    <div class="field"><label for="fUsed">Used for (optional)</label><input id="fUsed" name="usedFor" value="${esc(h.usedFor || "")}" placeholder="One line, shown under the head on the phone"></div>
    ${existing ? `<div class="box">
      ${h.closed
        ? `<div class="note"><b>This head is closed.</b> It is hidden from the overview, the phone and the forms. Its entries are kept.</div>
           <div><button class="ghost" type="button" data-act="reopenhead">Reopen it</button></div>`
        : `<div class="note"><b>No longer using it?</b> Closing hides it from the overview, the phone and the forms, and keeps its history. Anything still owed to you on it still counts. You can reopen it any time.</div>
           <div><button class="ghost" type="button" data-act="closehead">Close this head</button></div>`}
      <div class="note">${used ? `Deleting removes it <b>and its ${[u.expenses && plural(u.expenses, "expense"), u.balances && plural(u.balances, "balance")].filter(Boolean).join(" and ")}</b>. Undo can bring them back.` : "Nothing uses this head, so it can simply be deleted."}</div>
      <div><button class="danger" type="button" data-act="delete">${used ? "Delete with its entries" : "Delete"}</button></div>
    </div>` : ""}
    <div class="btnrow"><button class="primary" type="submit" value="save">Save <kbd>⌘↵</kbd></button></div>`;
  openDrawer(html, () => saveHead(existing), el => {
    const sync = () => ($("#finBox", el).hidden = el.elements.kind.value !== "finite");
    el.addEventListener("change", sync); sync();
  });
}
async function saveHead(existing) {
  const el = form.el;
  clearErrs(el);
  const v = n => (el.elements[n]?.value ?? "").trim();
  const h = { id: existing?.id, name: v("name"), kind: el.elements.kind.value };
  if (existing?.closed) h.closed = true;
  if (v("code")) h.code = v("code");
  if (v("usedFor")) h.usedFor = v("usedFor");
  if (!h.name) return fieldErr(el.elements.name, "Give the head a name.");
  if (S.doc.heads.some(x => x.name.toLowerCase() === h.name.toLowerCase() && x.id !== h.id)) return fieldErr(el.elements.name, "Another head already has this name.");
  if (h.kind === "finite") {
    if (v("total")) { h.total = parseAmount(v("total")); if (h.total == null) return fieldErr(el.elements.total, "Enter an amount, or leave it empty."); }
    if (v("validTill")) h.validTill = v("validTill");
  }
  if (!h.id) {
    const base = h.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30) || "head";
    let id = base, n = 2;
    while (S.doc.heads.some(x => x.id === id)) id = `${base}-${n++}`;
    h.id = id;
  }
  const next = clone(S.doc);
  next.heads = existing ? next.heads.map(x => (x.id === existing.id ? h : x)) : [...next.heads, h];
  if (await commit(next, `${existing ? "Changed" : "Added"} the head “${h.name}”.`)) closeDrawer(true);
}
async function deleteHead(existing) {
  const u = usesOf(existing.id);
  const next = clone(S.doc);
  next.heads = next.heads.filter(x => x.id !== existing.id);
  next.expenses = next.expenses.filter(e => e.head !== existing.id);
  next.statements = next.statements.filter(x => x.head !== existing.id);
  const gone = [u.expenses && plural(u.expenses, "expense"), u.balances && plural(u.balances, "balance")].filter(Boolean).join(" and ");
  if (await commit(next, `Deleted the head “${existing.name}”${gone ? ` and its ${gone}` : ""}.`)) closeDrawer(true);
}
async function setClosed(existing, closed) {
  const next = clone(S.doc);
  next.heads = next.heads.map(x => (x.id !== existing.id ? x : closed ? { ...x, closed: true } : (({ closed: _, ...rest }) => rest)(x)));
  if (await commit(next, closed ? `Closed “${existing.name}”. Its entries are kept; reopen it from Heads.` : `Reopened “${existing.name}”.`)) closeDrawer(true);
}

/* ------------------------------------------------------------------ *
 * Events
 * ------------------------------------------------------------------ */
function openNew(kind, preset = {}) {
  if (!S.doc || (S.sample && !browsingSample)) return;
  if (form) closeDrawer();
  if (form) return;
  ({ expense: () => expenseForm(null, preset), balance: () => balanceForm(null, preset), payslip: () => payslipForm(), head: () => headForm() })[kind]();
}

document.addEventListener("click", async ev => {
  const t = ev.target;
  const n = t.closest("[data-new]");
  if (n) return openNew(n.dataset.new, n.dataset.head ? { head: n.dataset.head } : {});
  const a = t.closest("[data-act]");
  if (a) {
    const act = a.dataset.act;
    if (act === "close") return closeDrawer();
    if (act === "undo") { $("#toast").hidden = true; return undo(); }
    if (act === "browse") { browsingSample = true; return render(); }
    if (act === "gostart") { browsingSample = false; return render(); }
    if (act === "reveal") return store.reveal();
    if (act === "keys") return toast("N new expense · B balance · P payslip · / search · 1–5 switch pages · ⌘Z undo · Esc close · ⌘↵ save");
    if (act === "refresh") return store.refresh();
    if (act === "signin") return store.signIn();
    if (act === "signout") return store.signOut();
    if ((act === "closehead" || act === "reopenhead") && form?.existing?.kind === "head") return setClosed(form.existing.h, act === "closehead");
    if (act === "delete" && form) {
      return armDelete(a, () => {
        const ex = form.existing;
        return ex.kind === "expense" ? deleteExpense(ex.id) : ex.kind === "balance" ? deleteBalance(ex.s) : ex.kind === "payslip" ? deletePayslip(ex.p) : deleteHead(ex.h);
      });
    }
  }
  const slip = t.closest("[data-openslip]");
  if (slip) return store.openPayslip(slip.dataset.openslip);
  const dec = t.closest("[data-decide]");
  if (dec) {
    let r;
    try { r = await store.decide(dec.dataset.id, dec.dataset.decide); } catch { return; }
    if (!r.ok) return toast(r.error, "crit");
    adopt(r.state);
    return toast(dec.dataset.decide === "apply" ? "The phone's version is in." : "The phone's change is set aside, in the backups folder.");
  }
  const quick = t.closest("[data-quick]");
  if (quick) {
    const e = S.doc.expenses.find(x => x.id === quick.dataset.id);
    // A foreign-currency claim needs the rupee amount paid back. Where the row has no box for it, ask in the form.
    if (quick.dataset.quick === "reimb" && estimated(e) && !$(`[data-fix="${CSS.escape(e.id)}"]`)) {
      expenseForm(e);
      track("expense", e);
      const box = form.el.elements.hasReimbursed;
      box.checked = true;
      box.dispatchEvent(new Event("change", { bubbles: true }));
      form.dirty = true;
      form.el.elements.inrFixed.focus();
      return;
    }
    return markDone(quick.dataset.quick, [e.id], TODAY);
  }
  const bulk = t.closest("[data-bulk]");
  if (bulk) { const k = bulk.dataset.bulk; return markDone(k, [...ui.sel[k]], $(`[data-bulkdate="${k}"]`).value); }
  const clr = t.closest("[data-clear]");
  if (clr) { ui.sel[clr.dataset.clear].clear(); return render(); }
  const sc = t.closest("[data-scroll]");
  if (sc) return document.getElementById(sc.dataset.scroll)?.scrollIntoView({ behavior: "smooth", block: "start" });
  const st = t.closest("[data-stage]");
  if (st) { ui.stage = st.dataset.stage; return render(); }
  const sf = t.closest("[data-salfy]");
  if (sf) { ui.salFy = sf.dataset.salfy; return render(); }
  if (t.closest("input, button, a, select, label")) return;
  const row = t.closest("[data-edit]");
  if (row) { const e = S.doc.expenses.find(x => x.id === row.dataset.edit); if (e) { expenseForm(e); track("expense", e); } return; }
  const sr = t.closest("[data-editst]");
  if (sr) { const [head, asOn] = sr.dataset.editst.split("|"); const s = S.doc.statements.find(x => x.head === head && x.asOn === asOn); balanceForm(s); track("statement", s); return; }
  const pr = t.closest("[data-editslip]");
  if (pr) { const p = S.doc.payslips.find(x => x.month === pr.dataset.editslip); payslipForm(p); track("payslip", p); return; }
  const hr = t.closest("[data-edithead]");
  if (hr) { const h = S.doc.heads.find(x => x.id === hr.dataset.edithead); headForm(h); track("head", h); return; }
  const go = t.closest("[data-goto]");
  if (go) { location.hash = go.dataset.goto; if (go.dataset.head) setTimeout(() => document.getElementById("bal-" + go.dataset.head)?.scrollIntoView({ block: "start" }), 30); }
});

document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset.pick) { const s = ui.sel[t.dataset.pick]; t.checked ? s.add(t.value) : s.delete(t.value); return rerenderKeepScroll(); }
  if (t.dataset.all) { const k = t.dataset.all, s = ui.sel[k]; s.clear(); if (t.checked) for (const e of LISTS[k].rows()) s.add(e.id); return rerenderKeepScroll(); }
  if (t.id === "fHead") { ui.head = t.value; $("#xbody").innerHTML = expenseTable(); }
  if (t.id === "fFy") { ui.fy = t.value; $("#xbody").innerHTML = expenseTable(); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "q") { ui.q = t.value; $("#xbody").innerHTML = expenseTable(); }
  if (t.dataset.fix) ui.fixed[t.dataset.fix] = t.value;
});
document.addEventListener("submit", async ev => {
  if (ev.target.id !== "startForm") return;
  ev.preventDefault();
  const heads = $$("input[name=h]:checked", ev.target).map(x => store.starter[Number(x.value)]);
  let r;
  try { r = await store.startReal(heads); } catch { return; }
  if (!r.ok) return toast(r.error, "crit");
  browsingSample = false;
  undoStack.length = 0;
  adopt(r.state);
  toast("Your real budget is started. The phone shows it the next time it is opened.");
});
/* An entry opened in a form, as it was then: a save is refused if it has
   since been changed somewhere else (the phone, another window). */
function track(kind, x) {
  const name = { statement: "balance" }[kind] || kind;
  form.existing = { kind: name, ...(kind === "expense" ? { id: x.id } : kind === "statement" ? { s: x } : kind === "payslip" ? { p: x } : { h: x }) };
  form.opened = { kind, key: entryKey(kind, x), entry: clone(x) };
}
function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

$("#scrim").addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", ev => {
  const typing = ev.target instanceof Element && ev.target.closest("input, textarea, select, [contenteditable]");
  if (form) {
    if (ev.key === "Escape") { ev.preventDefault(); closeDrawer(); }
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); form.el.requestSubmit(form.el.querySelector("[type=submit][value=save]")); }
    return;
  }
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "z" && !typing) { ev.preventDefault(); return undo(); }
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === "n") { ev.preventDefault(); openNew("expense"); }
  else if (k === "b") { ev.preventDefault(); openNew("balance"); }
  else if (k === "p") { ev.preventDefault(); openNew("payslip"); }
  else if (k === "/") { ev.preventDefault(); location.hash = "expenses"; setTimeout(() => $("#q")?.focus(), 30); }
  else if ("12345".includes(k) && k) location.hash = VIEWS[Number(k) - 1];
});

function route() {
  const v = location.hash.slice(1);
  ui.view = VIEWS.includes(v) ? v : "overview";
  if (S.doc) { render(); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", route);

ui.view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview";
for (const el of $$("[data-only]")) el.hidden = el.dataset.only !== store.kind;
$("#where").textContent = PHONE ? "On this phone" : "Entries, on this laptop";
store.start(pageApi);
</script>
</body>
